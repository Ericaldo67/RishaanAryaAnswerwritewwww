use of space, characters, and imagery to clearly communicate the message.","PR:251","Explain the importance of coordinating elements in advertisements","Promotion"],["x15gst37","When a business lowered its prices during a bad economic time, it demonstrated __________ pricing.",["realistic","exchange","competitive","flexible"],3,"Flexible. Because pricing is a tug-of-war and a constant quest for balance, businesses must be willing to be flexible and adjust their prices as necessary. For example, during bad economic times, customers are cautious about how they spend their money, and businesses may need to lower prices to attract these customers. Realistic pricing means prices are what customers expect to pay. Competitive pricing involves being aware of the prices others are charging and pricing your own products accordingly. Exchange price is the amount of money that the buyer is willing to pay and the seller is willing to accept for a good or service.","PI:001","Explain the nature and scope of the pricing function","Pricing"],["xptn9sx","The owner of Doxie Dog Rescue wrote an article about the organization's latest fundraising campaign and emailed it to three local newspapers. She hopes that at least one of the three papers will run the article for free in their publication. Doxie Dog's owner is using a __________ to promote her organization's activities.",["editorial","press kit","matte release","letter to the editor"],2,"Matte release. Generally used as filler material in written publication, a matte release is an article that is not generated by a publication's staff. Instead, businesses write these matte releases and submit the material to be printed by one or more media outlets. The business benefits from free promotion, and the publication benefits because the content takes up space. A matte release may be contained in a press kit. An editorial is generally written by a staff member of a publication. A letter to the editor is a form of editorial that is generally written by readers of the publication.","PR:250","Explain communications channels used in public-relations activities","Promotion"],["x18j81on","What is the primary goal of corporate promotion?",["To explain a specific feature","To create a certain image","To publicize a service","To sell a product"],1,"To create a certain image. The primary goal of corporate promotion is to create a certain image of the company in the eyes of the consumer. This is accomplished by informing consumers about the company, its ideas, and its philosophy. Unlike product promotion, institutional or corporate promotion does not attempt to sell a good or service. The goal of corporate promotion is not to explain a specific feature.","PR:002","Explain the types of promotion (i.e., institutional, product)","Promotion"],["x52wxnj","When Jamie develops a questionnaire, she places very broad questions at the beginning of the questionnaire and progressively includes questions that are narrower in scope toward the end of it. What sequencing format is Jamie using to develop the questionnaire?",["Branching","Funnel","Bridging","Remote"],1,"Funnel. The funnel approach involves asking very broad questions at the beginning of the questionnaire. This helps the respondents focus and get comfortable with the survey. Then, the questionnaire progressively asks the questions that are narrower in scope toward the end of the questionnaire. The funnel approach helps researchers organize the questionnaire in a way that prevents question-order bias. Branching is a technique that requires respondents to go to another place in the questionnaire to answer specific questions if they respond a certain way to the initial question. Bridging and remote are not questionnaire formats.","IM:293","Evaluate questionnaire design (e.g., types of questions, question wording, routing, sequencing, length, layout)","Marketing-Info Management"],["x1k64qac","A characteristic of product bundling is that a business sells several products together for a(n)",["higher interest rate.","higher profit margin.","reduced price.","unlimited time."],2,"Reduced price. Product bundling is the practice of putting together a number of goods/services to create a one- price package. Most often, the bundled package is priced so it costs the customer less than if they purchased each product separately. The goal of product bundling is to increase sales and to get customers to try something that they normally wouldn't purchase. The interest rate is the percentage figure used in calculating interest charges, which are money payments for borrowed money. Product bundling does not always provide the business with a higher profit margin, nor does it always require the business to consider interest rates. The amount of time a business bundles particular products depends on the type of product and the business's objectives.","PM:041","Describe the nature of product bundling","Product/Service Management"],["x1wm42qy","A business might be involved in the illegal activity of deceptive pricing if it",["misleads customers about the true value of a product.","changes prices according to current demand.","offers special prices on a discontinued item.","sells products at a limited number of predetermined price points."],0,"Misleads customers about the true value of a product. Deceptive pricing is an illegal pricing tactic because it misleads customers about the true value of a product. An example of deceptive pricing is setting a high price on a product and then advertising a big discount which actually reduces the price to a realistic, or normal, level. Customers buy the item because they think they are saving money when, in fact, they are paying what the item is actually worth. Price lining involves selling products at a limited number of predetermined price points. Variable pricing involves changing prices according to current demand. Promotional pricing involves offering special prices on certain products such as discontinued items. These pricing activities are not illegal.","PI:017","Explain legal considerations for pricing","Pricing"],["x148ez6u","The Calisto Cafe franchise calculated how many times its new menu item sold. What type of research data did the company collect?",["Quantitative","Qualitative","Descriptive","Exploratory"],0,"Quantitative. Calisto Cafe collected numeric data to determine how many times its new menu item sold. Therefore, it collected quantitative data, which are specific and measurable. The franchise did not collect qualitative data based on thoughts, opinions, feelings, or experiences. Exploratory and descriptive are types of research, not types of data.","IM:284","Describe methods used to design marketing research studies (i.e., descriptive, exploratory, and causal)","Marketing-Info Management"],["x2awhuc","An electronic data interchange (EDI) system facilitates a company's ability to",["test product quality.","manage product availability.","improve product durability.","develop new products."],1,"Manage product availability. An electronic data interchange (EDI) system allows a company to monitor its inventory and order products through a computer connection that it shares with its vendors. An EDI system helps a company monitor its inventory to ensure that enough products are available when and where they are needed. An EDI system does not facilitate a company's ability to improve product durability, test product quality, or develop new products.","PM:039","Describe the use of technology in the product/service management function","Product/Service Management"],["x1wi4rk1","Traits of successful salespeople include self-motivation, persistence, and",["impatience.","self-confidence.","insecurity.","selective listening skills."],1,"Self-confidence. The success and profitability of a business depends on how well the product sells. As employees, salespeople must be successful in persuading customers to purchase the company's products. Successful salespeople exhibit self-confidence; that is, they believe in their talents, skills, and objectives during the selling process. And by exhibiting self-confidence, salespeople communicate a sense of knowledge and credibility to the customer. Traits of successful salespeople also include patience, positive self-esteem, and comprehensive listening skills.","SE:017","Explain the nature and scope of the selling function","Selling"],["x1jwjlgi","Which of the following is a benefit to consumers of promotion:",["Building a clientele","Creating a specific image","Increasing sales of products","Learning new ways to use products"],3,"Learning new ways to use products. Consumers often learn new or better ways to use the products they purchase from the promotions for the products. This helps them to receive full value for their money. Increasing sales of products, creating an image, and building a clientele are promotional activities that benefit the business.","PR:001","Explain the role of promotion as a marketing function","Promotion"],["x1rz9iyo","Which of the following is an example of salespeople using customer service to facilitate sales relationships:",["Following up only when necessary","Sending information about competitors","Responding to complaints promptly","Recommending expensive new products"],2,"Responding to complaints promptly. Salespeople invest a lot of time in acquiring customers; therefore, it is important that they concentrate on developing those relationships. One way to maintain and improve a sales relationship is to provide excellent customer service, such as responding to complaints promptly. Salespeople who respond promptly are telling their customers that they are important and that their business is valuable. Customers appreciate the prompt attention and usually respond by continuing to do business with the salesperson. Salespeople should follow up with customers frequently rather than only when necessary. Salespeople do not send information about competitors or recommend expensive new products that their customers don't need.","SE:076","Explain the role of customer service as a component of selling relationships","Selling"],["x1i6l96a","What do advertising regulations usually require businesses to disclose about the products they advertise?",["Hidden features","Endorsements","Limitations","Personal benefits"],2,"Limitations. Certain products have limitations, such as producing side effects in some people or being potentially hazardous. When businesses advertise these products, they are usually required to disclose the limitations so consumers can make an informed decision about whether to buy. Businesses that violate these regulations run the risk of being sued by consumers who were harmed by the products. Advertisements usually describe the benefits of the products and often contain endorsements. Advertisements often point out important features, especially if they are hidden.","PR:101","Describe the regulation of promotion","Promotion"],["x1p0thz1","Effective marketing-research projects have certain specific characteristics that apply to all research regardless of scope or complexity. Two characteristics of effective marketing research are",["thorough and debatable.","systematic and timely.","objective and superficial.","accurate and incomprehensive."],1,"Systematic and timely. Two ways to describe effective marketing research are systematic and timely. Marketing research is systematic because it follows a step-by-step process that involves gathering, recording, and analyzing information. Marketing research is timely because there are usually due dates associated with it. Other ways to describe effective marketing research include accurate, objective, thorough, reliable, and valid. Incomprehensive, superficial, and debatable are not terms used to describe effective marketing research.","IM:010","Explain the nature of marketing research","Marketing-Info Management"],["xksl8h3","A company features an ad of a man doing common household tasks like washing the dishes and doing laundry. What recommended ethical promotion practice is demonstrated in this commercial?",["Avoid stereotypes and sexism.","Consider social responsibility.","Handle customer information responsibly.","Exaggerate product benefits."],0,"Avoid stereotypes and sexism. Ethical marketers seek diversity in both representation and decision-making teams. They avoid sexist or ableist language and imagery and gather feedback from diverse focus groups. Marketers need to consider impact over intent. Society often assumes common household tasks are done by women, so an ad depicting a man washing the dishes and doing laundry follows the recommended ethical promotion practice of avoiding stereotypes and sexism. This commercial does not demonstrate the recommended ethical promotion practices of considering social responsibility or handling customer information responsibly. Exaggerating product benefits is not a recommended ethical promotion practice.","PR:099","Describe the use of business ethics in promotion","Promotion"],["xihysdn","What activity involves transforming facts and figures into a useful format?",["Data processing","Information gathering","Data mining","Information reporting"],0,"Data processing. Data processing is an important activity in the marketing-information management function because data are typically not useful in their original form. Data processing takes the raw data and transforms them into organized, meaningful marketing information. After transforming the data into useable information, marketers gather the information and prepare reports to facilitate decision making. Data mining is the process of searching computer databases to look for patterns and relationships among information.","IM:001","Explain the nature and scope of the marketing-information management function","Marketing-Info Management"],["x1io9w1p","One of the purposes of the situational analysis component of a marketing plan is to determine a business's",["operating objectives.","distribution channels.","expansion options.","current weaknesses."],3,"Current weaknesses. A situational analysis is a determination of a firm's current business situation and the direction in which the business is headed. Both internal and external environmental conditions are evaluated to determine the business's current strengths, weaknesses, opportunities, and threats. It is important for a business to identify and understand its weaknesses to make adjustments in the marketing plan. If businesses fail to address their weaknesses, they may lose customers to competitors. Determining distribution channels, operating objectives, and expansion options are not the purposes of the situational analysis component of a marketing plan.","MP:007","Explain the nature of marketing plans","Market Planning"],["x1qq3xwh","A maker of detergents, soaps, and cleaning supplies divides its market according to consumers' response to the company's products. This business is using __________ segmentation.",["demographic","behavioral","psychographic","geographic"],1,"Behavioral. Behavioral segmentation groups consumers into categories on the basis of what they are looking for in a product and why they buy the product. Demographic segmentation divides a market by characteristics people have in common that affect their purchasing power. Geographic segmentation groups consumers according to where they are located. Psychographic segmentation groups people into markets on the basis of lifestyles and personalities.","MP:003","Explain the concept of market and market identification","Market Planning"],["x1f9tj9c","A minor league sports team displays the logo of a local business on its jerseys in exchange for sponsorship money. This collaboration is an example of a(n)",["public relations campaign.","customer support network.","supply chain.","affinity partnership."],3,"Affinity partnership. Affinity partnerships are strategic relationships formed among companies or organizations for mutual benefit. A sports team displaying a business logo on its jerseys is an example of an affinity partnership. The sports team benefits from the sponsorship money, while the business benefits from the increased brand exposure. This collaboration is not an example of a supply chain, which is a system of processes involved in the production and distribution of a product. It is not an example of a customer support network or a public relations campaign.","CM:021","Explain the nature of affinity partner relationships","Channel Management"]]</script>








<script>// NC DECA Practice. Shared login. Test history is stored in each browser.
(function () {
  'use strict'
  var MINUTES = 90
  var IDX = window.DECA_INDEX
  var LS = 'rishaananswerwrite.v1', CFG = window.DECA_CFG, SB = 'rishaananswerwrite.session'
  var $ = function (s) { return document.querySelector(s) }
  var main = $('#main'), bar = $('#bar'), topright = $('#topright')
  var st = load()
  var timerId = null, loaded = {}, test = null, popping = false
  function mark(v, id) { if (!popping) history.pushState({ v: v, id: id }, '') }
  window.addEventListener('popstate', function (ev) {
    var s = ev.state || { v: 'list' }; popping = true
    try {
      if (s.v === 'instr' && examById(s.id)) instructions(examById(s.id))
      else if (s.v === 'results' && st.results[s.id]) results(st.results[s.id])
      else if (s.v === 'login') showLogin()
      else if (s.v === 'account') showAccount()
      else showList()
    } finally { popping = false }
  })

  function load() {
    try { var s = JSON.parse(localStorage.getItem(LS)); if (s) return s } catch (e) {}
    return { user: { name: '', school: '' }, results: {}, hist: [], pending: [], active: null, study: false }
  }
  function save() { try { localStorage.setItem(LS, JSON.stringify(st)) } catch (e) {} }
  // ---------- server ----------
  function sess() { try { return JSON.parse(localStorage.getItem(SB)) } catch (e) { return null } }
  function setSess(x) { try { x ? localStorage.setItem(SB, JSON.stringify(x)) : localStorage.removeItem(SB) } catch (e) {} }
  // Shared logins (ID = password, not case sensitive). Scores stay in this browser, kept separate per account.
  var ACCOUNTS = {
    aazy: { name: 'Aazyan Eman', school: 'Apex Friendship High School', only: 'Business Management & Administration' },
    nish: { name: 'Rishaan Arya', school: 'Apex Friendship High School', only: 'Marketing' }
  }
  function acctFor(email) { var id = String(email || '').toLowerCase().replace(CFG.domain, ''); return ACCOUNTS[id] ? id : null }
  function AS_KEY() { var x = sess(); return 'rishaananswerwrite.attempts.' + (x && x.uid || 'anon') }
  function tokenReq(q, body) {
    if (q === 'refresh_token') return Promise.resolve({ access_token: 'local', refresh_token: 'local', expires_in: 315360000, user: { id: (sess() || {}).uid } })
    var id = acctFor(body.email)
    if (!id || String(body.password).toLowerCase() !== id) return Promise.reject({ auth: true, msg: 'Login failed' })
    return Promise.resolve({ access_token: 'local', refresh_token: 'local', expires_in: 315360000, user: { id: id } })
  }
  function keep(j) { var x = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Math.floor(Date.now() / 1000) + (j.expires_in || 3600), uid: j.user && j.user.id || (sess() || {}).uid }; setSess(x); return x }
  function token() {
    var x = sess(); if (!x) return Promise.reject({ auth: true, msg: 'Not signed in' })
    if (x.expires_at - 60 > Date.now() / 1000) return Promise.resolve(x.access_token)
    return tokenReq('refresh_token', { refresh_token: x.refresh_token }).then(function (j) { return keep(j).access_token })
  }
  function rest(path, method, body) {
    return token().then(function () {
      var uid = (sess() || {}).uid, acct = ACCOUNTS[uid] || { name: 'Student', school: 'Apex Friendship High School' }
      if (path.indexOf('profiles') === 0) return [{ name: acct.name, school: acct.school, student_id: uid }]
      var AS = AS_KEY(), list = []; try { list = JSON.parse(localStorage.getItem(AS)) || [] } catch (e) {}
      if (method === 'POST') { body.id = Date.now(); body.taken_at = new Date().toISOString(); list.push(body); try { localStorage.setItem(AS, JSON.stringify(list.slice(-300))) } catch (e) {} return null }
      return list.slice().reverse()
    })
  }
  function useAccount(uid) { LS = 'rishaananswerwrite.u.' + uid; st = load() }
  function indexAttempts() {
    st.results = {}
    ;(st.hist || []).forEach(function (a) {
      var ex = IDX.exams.filter(function (e) { return e.name === a.name })[0] || examById(a.exam_id)
      if (ex) st.results[ex.id] = { id: ex.id, name: ex.name, ts: a.ts, score: a.score, total: a.total, ans: a.ans }
    })
  }
  function flushPending() {
    var p = st.pending || []; if (!p.length) return Promise.resolve()
    st.pending = []; save()
    return p.reduce(function (pr, rec) { return pr.then(function () { return rest('attempts', 'POST', rec).catch(function () { st.pending.push(rec); save() }) }) }, Promise.resolve())
  }
  function syncAll() {
    var x = sess(); if (!x) return Promise.reject({ auth: true })
    useAccount(x.uid)
    return rest('profiles?select=name,school,student_id').then(function (p) { if (p[0]) st.user = { name: p[0].name, school: p[0].school, sid: p[0].student_id } }).then(flushPending).then(function () {
      return rest('attempts?select=id,exam_id,name,cluster,score,total,seconds,ans,items,taken_at&order=taken_at.desc&limit=300')
    }).then(function (rows) {
      st.hist = rows.reverse().map(function (a) { return { id: a.id, exam_id: a.exam_id, name: a.name, cluster: a.cluster, score: a.score, total: a.total, ans: a.ans, items: a.items, ts: Date.parse(a.taken_at) } })
      indexAttempts(); save()
    })
  }

  function legend() {
    return '<div class="legend"><div>Question has NOT been answered.<br><span class="dot n"></span></div><div>Answer has NOT been saved.<br><span class="dot u"></span></div><div>Answer HAS been saved.<br><span class="dot s"></span></div></div>'
  }
  function alertBox(extra) {
    return '<div class="alertr" id="alr"><span class="cls" id="alx">&times;</span><b>PLEASE NOTE:</b><ul><li>You may Not leave this page until the test Is complete. Doing so will submit your test.</li>' + (extra ? '<li>Unanswered questions have an asterisk (?) to their left and are highlighted in DARK RED.</li>' : '') + '</ul></div>'
  }
  function wireAlert() { var x = $('#alx'); if (x) x.onclick = function () { $('#alr').style.display = 'none' } }
  function qBlock(r, u, num, locked, skipped) {
    var done = u != null && u !== -1
    return '<div class="q' + (skipped ? ' skip' : '') + '"><span class="dot ' + (done ? 's' : 'n') + '"></span>' + (skipped ? '? ' : '') + num + ' ' + esc(r[1]) + '</div>' +
      r[2].map(function (o, j) {
        return '<div class="opt' + (skipped ? ' skip' : '') + '"><label><input type="radio" name="o" value="' + j + '"' + (j === u ? ' checked' : '') + (locked ? ' onclick="return false"' : '') + '>' + L[j] + '. ' + esc(o) + '</label></div>'
      }).join('')
  }
  function question(keep) {
    var r = test.rows[test.cur], a = test.ans[test.cur], n = test.rows.length
    var back = false
    for (var k = 0; k <= test.max; k++) if (k !== test.cur && test.ans[k] == null) back = true
    var html = alertBox(true) +
      '<div class="navs">' + (back ? '<button id="prevu" style="left:14%">&lt;&lt; Previous Unanswered</button>' : '') + (test.cur > 0 ? '<button id="prev" style="left:5%">&lt;&lt; Prev</button>' : '') + '<button id="next" style="left:35.2%">Next &gt;&gt;</button>' + (back ? '<button id="nextu" style="left:47.8%">Next Unanswered &gt;&gt;</button>' : '') + '</div>' +
      qBlock(r, a, (test.cur + 1) + '.', false, a == null && !!(test.left && test.left[test.cur]))
    if (keep) { var y = window.scrollY; main.innerHTML = html; window.scrollTo(0, y) } else h(html)
    wireAlert()
    if ($('#prev')) $('#prev').onclick = function () { go(test.cur - 1) }
    $('#next').onclick = function () { test.cur + 1 >= n ? review() : go(test.cur + 1) }
    if (back) $('#prevu').onclick = function () { for (var k = 1; k <= n; k++) { var i = (test.cur - k + n) % n; if (i <= test.max && test.ans[i] == null) return go(i) } }
    if (back) $('#nextu').onclick = function () { for (var k = 1; k <= n; k++) { var i = (test.cur + k) % n; if (i <= test.max && test.ans[i] == null) return go(i) } }
    main.querySelectorAll('input[name=o]').forEach(function (inp) { inp.onchange = function () { test.ans[test.cur] = +inp.value; persist(); question(true) } })
  }
  function go(i) { if (test.ans[test.cur] == null) { test.left = test.left || {}; test.left[test.cur] = 1 } test.cur = Math.max(0, Math.min(test.rows.length - 1, i)); test.max = Math.max(test.max, test.cur); persist(); question() }
  function review() {
    var un = test.ans.filter(function (x) { return x == null }).length
    h(alertBox(false) +
      '<p>' + (un ? 'You have <b class="red">unanswered questions</b> on your test.' : 'All questions are answered.') + '</p>' +
      '<p style="font-size:24px">Please review all your answers.</p><p>You are unable to change your answers within the review. To change an answer, click on the underlined question.</p>' +
      '<p>When you are sure you are finished, click the <b>Submit Test</b> button ONLY ONCE to submit your test.</p><button id="sub" style="padding:8px 14px">Submit Test</button>' +
      '<div class="review">' + test.rows.map(function (r, i) {
        var a = test.ans[i]
        return '<div class="q ' + (a == null ? 'unans' : '') + '"><span class="dot ' + (a == null ? 'n' : 's') + '"></span> ' + (a == null ? '<span class="red">?</span> ' : '') + '<a data-i="' + i + '">' + (i + 1) + '. ' + esc(r[1]) + '</a></div>' +
          r[2].map(function (o, k) { return '<div class="opt"><input type="radio" onclick="return false"' + (a === k ? ' checked' : '') + '>' + L[k] + '. ' + esc(o) + '</div>' }).join('')
      }).join('') + '</div>' +
      '<p>If you have finished reviewing your answers, click the "Submit Test" button to submit your test.</p><button id="sub2" style="padding:8px 14px">Submit Test</button>')
    wireAlert()
    $('#sub').onclick = $('#sub2').onclick = function () { submit(false) }
    main.querySelectorAll('[data-i]').forEach(function (a) { a.onclick = function () { go(+a.dataset.i) } })
  }
  function submit() {
    clearInterval(timerId); closeCalc()
    var score = 0
    test.rows.forEach(function (r, i) { if (test.ans[i] === r[3]) score++ })
    var res = { id: test.id, name: test.name, ts: Date.now(), score: score, total: test.rows.length, ans: test.ans, rows: test.mixed ? test.rows : null, mixed: test.mixed }
    st.results[test.id] = res
    var ex = examById(test.id), items = test.rows.map(function (r, i) { var ok = test.ans[i] === r[3]; return ok ? [r[5] || '', r[6] || '', r[7] || '', 1] : [r[5] || '', r[6] || '', r[7] || '', 0, r[0], r[1].slice(0, 140)] })
    var rec = { exam_id: test.id, name: test.name, cluster: ex ? ex.cluster : 'Mixed', score: score, total: test.rows.length, seconds: Math.round((MINUTES * 60000 - (test.endAt - Date.now())) / 1000), ans: test.ans, items: items }
    if (!st.hist) st.hist = []
    st.hist.push({ exam_id: rec.exam_id, name: rec.name, cluster: rec.cluster, score: score, total: rec.total, ans: test.ans, items: items, ts: Date.now() })
    rest('attempts', 'POST', rec).catch(function () { st.pending = (st.pending || []).concat([rec]); save() })
    st.active = null; save()
    showList()
  }

  // ---------- results / explanation ----------
  function expHtml(r) {
    var code = r[5], text = r[6], area = r[7]
    return '<div class="exp"><div><b>Explanation:</b> ' + (r[4] ? esc(r[4]) : 'None listed in this exam key.') + '</div>' +
      '<div><b>PI:</b> ' + (code ? esc(code) : 'None listed') + (text ? ' - ' + esc(text) : '') + (area && !/^Area code/.test(area) ? ' (' + esc(area) + ')' : '') + '</div></div>'
  }
  function results(res) {
    clearInterval(timerId); topright.innerHTML = '<button id="home">Test list</button>'
    $('#home').onclick = showList; mark('results', res.id)
    setBar(res.name + ' - Results')
    var rows = res.rows || (rowsOf(res.id) || []), a = res.ans
    if (!rows.length) { var e = examById(res.id); if (e) return loadFile(e.file).then(function () { res.rows = null; results(res) }) }
    var html = '<p style="font-size:22px">Score: ' + res.score + ' / ' + res.total + ' (' + Math.round(100 * res.score / res.total) + '%)</p>'
    rows.forEach(function (r, i) { html += qBlock(r, a[i] == null ? -1 : a[i], (i + 1) + '.', true) })
    html += '<p><button id="dl">Download Report</button> <button id="retake">Retake</button></p>'
    h(html)
    $('#dl').onclick = function () { downloadReport(res, rows) }
    $('#retake').onclick = function () { var e = examById(res.id); if (e) instructions(e); else instructions({ id: res.id, name: res.name, rows: rows, n: rows.length, mixed: true }) }
  }

  // ---------- report / account ----------
  function download(name, text, type) {
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: type || 'text/html' })); a.download = name
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove() }, 500)
  }
  var RCSS = '<style>body{font-family:Arial,Helvetica,sans-serif;margin:30px;color:#000}h1{font-size:22px}h2{font-size:18px;margin-top:26px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #666;padding:4px 6px;text-align:left;vertical-align:top;font-size:14px}.q{margin:16px 0 4px}.red{color:#e8291c}.green{color:#2f7d1f}.x{margin-left:30px;font-size:14px}</style>';
function downloadReport(res, rows) {
    var a = res.ans, miss = [], byPi = {}
    rows.forEach(function (r, i) { if (a[i] !== r[3]) { miss.push(i); var k = r[5] || 'No PI'; byPi[k] = byPi[k] || { n: 0, t: r[6] || '' }; byPi[k].n++ } })
    var h2 ='<html><head><meta charset="utf-8"><title>Report</title>' + RCSS + '</head><body><h1>NC DECA Practice - Test Report</h1>' +
      '<p>' + esc(st.user.name) + ' - ' + esc(st.user.school) + '<br>' + esc(res.name) + '<br>' + '' + '</p>' +
      '<p><b>Score: ' + res.score + ' / ' + res.total + ' (' + Math.round(100 * res.score / res.total) + '%)</b> - Wrong: ' + miss.filter(function (i) { return a[i] != null }).length + ' - Unanswered: ' + miss.filter(function (i) { return a[i] == null }).length + '</p>'
    var keys = Object.keys(byPi).sort(function (x, y) { return byPi[y].n - byPi[x].n })
    if (keys.length) h2 += '<h2>Missed questions by PI</h2><table><tr><th>PI</th><th>Description</th><th>Missed</th></tr>' + keys.map(function (k) { return '<tr><td>' + esc(k) + '</td><td>' + esc(byPi[k].t) + '</td><td>' + byPi[k].n + '</td></tr>' }).join('') + '</table>'
    h2 += '<h2>Questions answered incorrectly or left blank</h2>'
    miss.forEach(function (i) {
      var r = rows[i], u = a[i]
      h2 += '<div class="q"><b>' + (i + 1) + '.</b> ' + esc(r[1]) + '</div><div class="x red">Your answer: ' + (u == null ? '(none)' : L[u] + '. ' + esc(r[2][u])) + '</div><div class="x green">Correct answer: ' + L[r[3]] + '. ' + esc(r[2][r[3]]) + '</div>' +
        '<div class="x">Explanation: ' + esc(r[4] || 'None listed') + '</div><div class="x">PI: ' + esc(r[5] || 'None') + (r[6] ? ' - ' + esc(r[6]) : '') + '</div>'
    })
    if (!miss.length) h2 += '<p>Perfect score - nothing missed.</p>'
    download('DECA-report-' + res.name.replace(/[^A-Za-z0-9]+/g, '_').slice(0, 40) + '.html', h2 + '</body></html>')
  }
  function agg() {
    var H = st.hist || [], pi = {}, ar = {}, cl = {}, qs = {}
    H.forEach(function (t) {
      var c = cl[t.cluster] = cl[t.cluster] || { s: 0, n: 0, t: 0 }; c.s += t.score; c.t += t.total; c.n++
      t.items.forEach(function (it) {
        var k = it[0] || 'No PI', p = pi[k] = pi[k] || { t: 0, w: 0, txt: it[1] }; p.t++; if (!it[3]) p.w++; if (!p.txt) p.txt = it[1]
        var a = it[2] || 'Other', q = ar[a] = ar[a] || { t: 0, w: 0 }; q.t++; if (!it[3]) q.w++
        if (!it[3] && it[4]) { var m = qs[it[4]] = qs[it[4]] || { n: 0, q: it[5] }; m.n++ }
      })
    })
    return { H: H, pi: pi, ar: ar, cl: cl, qs: qs }
  }
  function bars(rows, color) {
    return rows.map(function (r) { return '<div style="display:flex;align-items:center;margin:3px 0;font-size:14px"><div style="width:300px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="' + esc(r.title || r.label) + '">' + esc(r.label) + '</div><div style="flex:1;background:#eee;height:16px;margin:0 8px"><div style="width:' + Math.max(0, Math.min(100, r.v)) + '%;height:16px;background:' + (r.color || color) + '"></div></div><div style="width:150px;flex:none">' + esc(r.right) + '</div></div>' }).join('')
  }
  function showAccount() {
    clearInterval(timerId); test = null; document.body.className = ''; mark('account'); $('#leg').innerHTML = ''; setBar('My Account - Performance Review')
    topright.innerHTML = '<button id="home">Test list</button>'; $('#home').onclick = showList
    var g = agg(), H = g.H
    if (!H.length) { h('<div class="box"><h3>Performance Review</h3><div class="body">No finished tests yet. Finish a test and your results will show up here (average score, weakest PIs, most missed questions).</div></div>'); return }
    var tot = H.reduce(function (a, t) { return a + t.score }, 0), den = H.reduce(function (a, t) { return a + t.total }, 0)
    var pcts = H.map(function (t) { return Math.round(100 * t.score / t.total) })
    var best = Math.max.apply(null, pcts), last = pcts[pcts.length - 1]
    var html = '<div class="box"><h3>Performance Review - ' + esc(st.user.name) + '</h3><div class="body">' +
      '<table style="width:auto"><tr><td>Tests finished</td><td><b>' + H.length + '</b></td></tr><tr><td>Questions answered</td><td><b>' + den + '</b></td></tr>' +
      '<tr><td>Average score</td><td><b>' + Math.round(100 * tot / den) + '%</b></td></tr><tr><td>Best score</td><td><b>' + best + '%</b></td></tr><tr><td>Latest score</td><td><b>' + last + '%</b></td></tr>' +
      '<tr><td>Last 5 tests average</td><td><b>' + Math.round(pcts.slice(-5).reduce(function (a, b) { return a + b }, 0) / Math.min(5, pcts.length)) + '%</b></td></tr></table>' +
      '<p><button id="dlp">Download Performance Report</button> <button id="rst">Clear History</button></p></div></div>'
    html += '<div class="box"><h3>Score on each test (most recent ' + Math.min(30, H.length) + ')</h3><div class="body">' + bars(H.slice(-30).map(function (t, i) { var p = Math.round(100 * t.score / t.total); return { label: t.name, v: p, right: t.score + '/' + t.total + ' (' + p + '%)', color: p >= 70 ? '#5cb85c' : '#d9534f' } }), '#3b82f6') + '</div></div>'
    var pk = Object.keys(g.pi).filter(function (k) { return g.pi[k].w > 0 }).sort(function (a, b) { return g.pi[b].w - g.pi[a].w || g.pi[a].t - g.pi[b].t }).slice(0, 20)
    html += '<div class="box"><h3>Performance indicators you miss most</h3><div class="body">' + (pk.length ? bars(pk.map(function (k) { var p = g.pi[k]; return { label: k + (p.txt ? ' - ' + p.txt : ''), title: k + ' ' + p.txt, v: 100 * p.w / p.t, right: p.w + ' wrong of ' + p.t + ' (' + Math.round(100 * (p.t - p.w) / p.t) + '% right)', color: '#d9534f' } }), '#d9534f') : 'Nothing missed yet.') + '</div></div>'
    var ak = Object.keys(g.ar).sort(function (a, b) { return (g.ar[a].t - g.ar[a].w) / g.ar[a].t - (g.ar[b].t - g.ar[b].w) / g.ar[b].t })
    html += '<div class="box"><h3>Accuracy by topic area (weakest first)</h3><div class="body">' + bars(ak.map(function (k) { var p = g.ar[k], pc = Math.round(100 * (p.t - p.w) / p.t); return { label: k, v: pc, right: pc + '% (' + p.t + ' seen)', color: pc >= 70 ? '#5cb85c' : '#f0ad4e' } }), '#3b82f6') + '</div></div>'
    var ck = Object.keys(g.cl)
    html += '<div class="box"><h3>Average by cluster</h3><div class="body">' + bars(ck.map(function (k) { var c = g.cl[k], pc = Math.round(100 * c.s / c.t); return { label: k, v: pc, right: pc + '% (' + c.n + ' tests)' } }), '#3b82f6') + '</div></div>'
    var qk = Object.keys(g.qs).filter(function (k) { return g.qs[k].n > 1 }).sort(function (a, b) { return g.qs[b].n - g.qs[a].n }).slice(0, 15)
    if (qk.length) html += '<div class="box"><h3>Questions you keep missing</h3><div class="body">' + qk.map(function (k) { return '<div style="margin:6px 0">Missed ' + g.qs[k].n + ' times: ' + esc(g.qs[k].q) + '...</div>' }).join('') + '</div></div>'
    html += '<div class="box"><h3>My Reports</h3><div class="body"><table class="tests" style="width:100%;min-width:0"><tr><td><b>Test</b></td><td><b>Score</b></td><td></td></tr>' + H.slice().reverse().slice(0, 100).map(function (a, i) { return '<tr><td>' + '' + '</td><td>' + esc(a.name) + '</td><td>' + a.score + '/' + a.total + ' (' + Math.round(100 * a.score / a.total) + '%)</td><td><button class="bb" data-rt="' + i + '">Retake</button> <button data-d="' + i + '">Download</button></td></tr>' }).join('') + '</table></div></div>'
    html += '<p style="font-size:13px">Your results are saved to your account.</p>'
    h(html)
    $('#dlp').onclick = function () { downloadPerf(g, pk, ak) }
    var rev = H.slice().reverse()
    var open = function (a, dl) {
      var ex = IDX.exams.filter(function (e) { return e.name === a.name })[0]
      if (!ex) { alert('This test is no longer in the question bank.'); return }
      loadFile(ex.file).then(function () { var res = { id: ex.id, name: ex.name, ts: a.ts, score: a.score, total: a.total, ans: a.ans }; dl ? downloadReport(res, rowsOf(ex.id)) : results(res) })
    }
    main.querySelectorAll('[data-d]').forEach(function (b) { b.onclick = function () { open(rev[+b.dataset.d], true) } })
    main.querySelectorAll('[data-rt]').forEach(function (b) { b.onclick = function () { var a = rev[+b.dataset.rt], ex = IDX.exams.filter(function (e) { return e.name === a.name })[0]; if (!ex) { alert('This test is no longer in the question bank.'); return } loadFile(ex.file).then(function () { instructions(ex) }) } })
    $('#rst').onclick = function () { if (confirm('Clear all performance history?')) { st.hist = []; st.results = {}; try { localStorage.removeItem(AS_KEY()) } catch (e) {} save(); showAccount() } }
  }
  function downloadPerf(g, pk, ak) {
    var H = g.H, tot = H.reduce(function (a, t) { return a + t.score }, 0), den = H.reduce(function (a, t) { return a + t.total }, 0)
    var out = '<html><head><meta charset="utf-8"><title>Performance Report</title>' + RCSS + '</head><body><h1>NC DECA Practice - Performance Report</h1><p>' + esc(st.user.name) + ' - ' + esc(st.user.school) + '<br>' + '' + '</p>' +
      '<p><b>Tests finished: ' + H.length + ' - Average score: ' + Math.round(100 * tot / den) + '%</b></p>' +
      '<h2>All tests</h2><table><tr><th>Test</th><th>Score</th></tr>' + H.map(function (t) { return '<tr><td>' + esc(t.name) + '</td><td>' + t.score + '/' + t.total + ' (' + Math.round(100 * t.score / t.total) + '%)</td></tr>' }).join('') + '</table>' +
      '<h2>PIs missed most</h2><table><tr><th>PI</th><th>Description</th><th>Wrong</th><th>Seen</th><th>% right</th></tr>' + pk.map(function (k) { var p = g.pi[k]; return '<tr><td>' + esc(k) + '</td><td>' + esc(p.txt) + '</td><td>' + p.w + '</td><td>' + p.t + '</td><td>' + Math.round(100 * (p.t - p.w) / p.t) + '%</td></tr>' }).join('') + '</table>' +
      '<h2>Accuracy by topic area</h2><table><tr><th>Area</th><th>% right</th><th>Seen</th></tr>' + ak.map(function (k) { var p = g.ar[k]; return '<tr><td>' + esc(k) + '</td><td>' + Math.round(100 * (p.t - p.w) / p.t) + '%</td><td>' + p.t + '</td></tr>' }).join('') + '</table></body></html>'
    download('DECA-performance-report.html', out)
  }

  // ---------- calculator ----------
  var calc = { cur: '0', acc: null, op: null, fresh: true }
  function toggleCalc() { var c = $('#calc'); c.hidden ? openCalc() : closeCalc() }
  function closeCalc() { $('#calc').hidden = true }
  function openCalc() {
    var c = $('#calc'); c.hidden = false
    var keys = ['7', '8', '9', '/', '4', '5', '6', '*', '1', '2', '3', '-', '0', '.', 'C', '+']
    c.innerHTML = '<div class="cbar" id="cbar">Calculator <button class="x" id="cx">X</button></div><div class="scr"><div class="ex" id="cx2"></div><div id="cs">' + calc.cur + '</div></div><div class="keys">' +
      keys.map(function (k) { return '<button data-k="' + k + '">' + (k === '*' ? '&times;' : k === '/' ? '&divide;' : k === '-' ? '&minus;' : k) + '</button>' }).join('') +
      '<button class="eq" data-k="=">=</button><button data-k="r">&radic;</button></div>'
    $('#cx').onclick = closeCalc
    c.onclick = function (ev) { var b = ev.target.closest ? ev.target.closest('[data-k]') : null; if (b) { press(b.dataset.k); ev.preventDefault() } }
    show()
    var bar = $('#cbar'), sx, sy, ox, oy, drag = false
    bar.onpointerdown = function (ev) { if (ev.target.id === 'cx') return; drag = true; sx = ev.clientX; sy = ev.clientY; var r = c.getBoundingClientRect(); ox = r.left; oy = r.top; bar.setPointerCapture(ev.pointerId); ev.preventDefault() }
    bar.onpointermove = function (ev) { if (!drag) return; c.style.left = Math.max(0, Math.min(window.innerWidth - 60, ox + ev.clientX - sx)) + 'px'; c.style.top = Math.max(0, Math.min(window.innerHeight - 40, oy + ev.clientY - sy)) + 'px' }
    bar.onpointerup = bar.onpointercancel = function () { drag = false }
  }
  document.addEventListener('keydown', function (ev) {
    var tg = ev.target || {}
    if ($('#calc').hidden || /TEXTAREA|SELECT/.test(tg.tagName || '') || (tg.tagName === 'INPUT' && tg.type !== 'radio' && tg.type !== 'checkbox')) return
    var k = ev.key
    if (/^[0-9+\-*\/.]$/.test(k)) press(k)
    else if (k === 'Enter' || k === '=') { press('='); ev.preventDefault() }
    else if (k === 'Escape' || k === 'c' || k === 'C') k === 'Escape' ? closeCalc() : press('C')
  })
  function press(k) {
    var apply = function () { var a = parseFloat(calc.acc), b = parseFloat(calc.cur), r = b; if (calc.op === '+') r = a + b; if (calc.op === '-') r = a - b; if (calc.op === '*') r = a * b; if (calc.op === '/') r = b === 0 ? NaN : a / b; calc.cur = isFinite(r) ? String(+r.toPrecision(12)) : 'Error' }
    if (calc.cur === 'Error' && k !== 'C') calc = { cur: '0', acc: null, op: null, fresh: true }
    if (/^\d$/.test(k)) { calc.cur = (calc.fresh || calc.cur === '0') ? k : calc.cur + k; calc.fresh = false }
    else if (k === '.') { if (calc.fresh) { calc.cur = '0.'; calc.fresh = false } else if (calc.cur.indexOf('.') < 0) calc.cur += '.' }
    else if (k === 'C') calc = { cur: '0', acc: null, op: null, fresh: true }
    else if (k === 'r') { calc.cur = String(+Math.sqrt(parseFloat(calc.cur)).toPrecision(12)); calc.fresh = true }
    else if (k === '=') { if (calc.op) { apply(); calc.op = null; calc.acc = null } calc.fresh = true }
    else { if (calc.op && !calc.fresh) apply(); calc.acc = calc.cur; calc.op = k; calc.fresh = true }
    show()
  }
  function show() {
    var d = $('#cs'), e = $('#cx2'); if (!d) return
    var sym = { '*': '\u00d7', '/': '\u00f7', '-': '\u2212', '+': '+' }
    var node = document.createElement('div'); node.id = 'cs'; node.textContent = calc.cur
    d.parentNode.replaceChild(node, d)
    if (e) e.textContent = calc.op && calc.acc != null ? calc.acc + ' ' + sym[calc.op] : '\u00a0'
  }

  window.addEventListener('beforeunload', function (ev) { if (test && test.endAt > Date.now()) { ev.preventDefault(); ev.returnValue = '' } })
  history.replaceState({ v: 'login' }, '')
  showLogin()
})()
</script>
