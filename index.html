ges","NF:321":"Monitor travel patterns","NF:325":"Create a destination management system to store data","OP:660":"Monitor group\u2019s activities to ensure compliance with safety regulations","OP:661":"Take and confirm reservations for travel and tourism services","OP:662":"Book tickets with hospitality and tourism service providers","OP:663":"Manage pre-booking travel processes","OP:664":"Manage post-booking travel processes","OP:665":"Manage currency exchange","OP:666":"Organize tours","OP:667":"Arrange transportation","OP:668":"Arrange accommodations for travelers","OP:669":"Arrange catering","OP:670":"Explain the principles of sustainable tourism development","OP:671":"Assess the environmental impact of tourism","PD:401":"Explain the nature of the travel and tourism industry","PD:402":"Distinguish between front office and back office operations in the travel business","PD:403":"Describe types of tours","PD:404":"Explain areas of specialization within the tour guide industry (e.g., historical, corporate, nature/eco, adventure, etc.)","PD:405":"Describe major destination types (e.g., cultural, natural, recreational)","PD:406":"Identify key travel destinations","PD:407":"Identify characteristics influencing classification of destinations","PD:408":"Identify attraction options/types by their destination classification","PD:409":"Distinguish between traditional and sustainable tourism","PD:410":"Distinguish among types of travel agencies based on services offered and their size","PD:411":"Explain types of travel companies (e.g., tour organizers, tour operators, retail/travel agents, brokers, consolidators, suppliers, etc.)","PD:412":"Discuss the roles and types of organizations involved in tourism marketing/promotion","PD:413":"Explain the purpose and scope of the conventions and meetings industry","PD:414":"Discuss the role of destination management organizations (DMOs)","PD:415":"Describe the purpose/use of contracted services in travel and tourism","PD:416":"Identify transportation/travel modes used in travel and tourism","PD:417":"Discuss the effect of tourism on the community (e.g., transportation systems, safety, security)","PD:420":"Describe employment opportunities in travel and tourism","PM:321":"Maintain destination brand","CM:026":"Identify affinity relationship opportunities","IM:486":"Monitor traveler behavior","IM:487":"Monitor attitude changes among local population","IM:488":"Track public perceptions of organization","IM:490":"Administer visitor experience survey","IM:491":"Conduct surveys of visitor/traveler perceptions","IM:492":"Conduct visitor/traveler satisfaction surveys","MP:046":"Describe types of travel market segments (e.g., luxury, business travel, mass market, cruise market, rail market, specialty/activity/sports markets, ski market, niche market, etc.)","MP:047":"Explain segments of the tour market (e.g., mode of transport, distance to destination, length of vacation, travel season, etc.)","PI:090":"Describe considerations in travel pricing","PI:091":"Discuss factors impacting the price of tours (e.g., season, exchange rates, competitive pricing, promotions, market segments, etc.)","PR:431":"Explain the purpose of tourism promotion","PR:432":"Identify communication channels used in travel and tourism promotion","PR:433":"Explain information points of contact within an overall tourism information system","PR:436":"Describe promotional displays used in travel and tourism","PR:437":"Explain the use of storytelling in promoting tourism","PR:434":"Support government initiatives for hospitality and tourism","PR:439":"Develop promotional brochures for travel and tourism","PR:440":"Develop community partnerships","PR:441":"Conduct familiarization (FAM) tours","PR:443":"Explain considerations in designing sales-promotion materials for use in travel and tourism","PR:444":"Identify considerations used to evaluate trade show/exposition participation","PR:445":"Participate in the design of collateral materials to promote special events/tours","PR:446":"Set up cross-promotions of events/tours","PR:447":"Participate in trade shows/expositions to showcase tourism assets/services","PR:451":"Explain the nature of marketing communications calendars","PR:452":"Develop marketing communications calendars","PR:458":"Manage comments on digital channels","SE:505":"Identify travel and tour plan options","SE:506":"Visit local attractions","SE:501":"Identify local attractions/events","SE:502":"Discuss key travel destinations in major geographical regions","SE:503":"Explain the nature of a region\u2019s geophysical/landscape/aesthetic features","SE:504":"Describe a region\u2019s sociocultural environment","SE:508":"Conduct pre-trip research","SE:509":"Discuss motivations of travelers","SE:510":"Determine client\u2019s tourism motives for use in offering recommendations","SE:511":"Research tourism options fitting client motives","SE:512":"Propose tourism experiences","SE:513":"Recommend individual/group travel arrangements","SE:514":"Recommend individual/group attractions/events/entertainment","SE:515":"Sell packaged travel and tourism products","SE:516":"Propose individual/group itineraries","SE:517":"Develop and submit sales proposal","SE:518":"Plan sales strategy","FM:012":"th","PD:274":"th","IM:420":"nd","SE:108":"th"}};</script>
<script>window.DECA_DATA=window.DECA_DATA||{};window.DECA_DATA["e12"]=[["xnqx0mx","When writing a persuasive business message, you should remember to",["communicate your personal goals.","open the message with a meaningful quote.","place the least important information at the beginning.","describe the benefits to the audience."],3,"Describe the benefits to the audience. The primary goal of a persuasive message is to influence behavior. Influencing others involves communicating benefits of taking action. The readers are more likely to respond favorably to the message if they know how the action will impact or help them. Communicating benefits is a central element to all types of persuasive messages. The beginning of the message should catch the readers' attention and encourage them to read more. Depending on the type of message, this might involve a quote. The message should be concise, so it should not contain unimportant information. The message should be written to communicate the business's goals rather than personal ones.","CO:031","Write persuasive messages","Communication Skills"],["x1n6y7gp","Which of the following is an example of a legal issue associated with information management:",["Quality assurance","Customer privacy","Employee training","Company reputation"],1,"Customer privacy. Most governments have regulations regarding the privacy rights of customers. For example, a law may state that companies may not give out the personal information of customers unless they receive permission. This is an example of a legal issue associated with information management. Company reputation, quality assurance, and employee training are not necessarily legal issues related to information management.","NF:076","Explain legal issues associated with information management","Information Management"],["x132kcbr","Allowing customers to voluntarily provide their own information in customer relationship management programs is beneficial in which of the following ways:",["It enables the sales department to prioritize sales leads.","It enables customers to offer suggestions for new services.","It enables the marketing department to tailor ads to those customers.","It enables customers to feel that the business is in control of their information."],1,"It enables customers to offer suggestions for new services. Businesses benefit from feedback and new ideas when customers voluntarily offer suggestions for new services. Allowing customers to voluntarily provide their own information does not directly benefit the sales or marketing departments. Customers voluntarily providing their own information allows the customers to feel they are the ones in control of their information, not the business.","CR:016","Discuss the nature of customer relationship management","Customer Relations"],["x1m0ltd5","Which of the following areas of management and administration is often referred to as “support staff”:",["Human resource management","Business information management","General management","Administrative services"],3,"Administrative services. Employees working in administrative services facilitate business operations through a variety of administrative and clerical duties, including information and communication management, data processing and collection, and project tracking. These positions are often referred to as support staff positions. Business information technology employees help to align business and IT goals. Careers in general management focus on planning, organizing, directing, and evaluating part or all of a business organization through the allocation and use of financial, human, and material resources. Human resource management careers focus on the staffing activities that involve planning, recruitment, selection, orientation, training, performance appraisal, compensation, and safety of employees.","PD:025","Explain employment opportunities in business","Professional Development"],["xt9muyo","How can a consumer typically determine the best interest rates for personal savings accounts and personal loans?",["Contact a brokerage firm to get advice.","Evaluate commercial banks' requirements and rates.","Evaluate rates offered by uninsured online banks.","Evaluate credit union requirements and rates."],3,"Evaluate credit union requirements and rates. Credit unions typically provide the highest interest rates on savings accounts and the lowest interest rates on loans. Commercial banks typically do not offer consumers the beneficial interest rates that credit unions can provide. Uninsured online banks sometimes offer better rates, but they also carry more risk. Brokerage firms buy and sell different types of securities and do not typically provide information about interest rates offered by banking institutions.","FI:075","Describe types of financial-services providers","Financial Analysis"],["x18voenh","Is it ever appropriate for an individual looking for a job to send a cover letter to a business that has not advertised a job opening?",["No; the business will discard the letter if it has no openings.","Yes; the worker should write to each business in the industry.","Yes; the worker can write if they have heard about a job opening.","No; a letter is used only in response to job advertisements."],2,"Yes; the worker can write if they have heard about a job opening. In some cases, a worker looking for a job will hear about a job opening from a source other than a job advertisement. It is acceptable for the worker to write a letter stating that they have heard of an opening and ask to be considered for the position. In some cases, this results in an interview and a job. Most companies do not discard such letters but keep them on file in case of future need. It would not be appropriate or practical to send letters to all businesses in the industry.","PD:030","Write a cover letter","Professional Development"],["x5fgryb","When you are able to respect and appreciate other people's unique viewpoints, you can",["have constructive dialogue with others.","take on more responsibility at work.","work more efficiently at your job.","expect people to take advantage of you."],0,"Have constructive dialogue with others. An important component of effective communication is respect. When you are able to respect and appreciate other people's unique viewpoints, you can have constructive dialogue with people of all backgrounds. Being able to respect and appreciate other people's unique viewpoints does not necessarily allow you to take on more responsibility at work; however, the ability to handle diverse viewpoints is a valuable skill that can make you an attractive job applicant. Your ability to work efficiently is not related to your ability to appreciate other viewpoints. People will not take advantage of you when you respect and appreciate their opinions. Rather, they will most likely return the favor and respect and appreciate your own opinions.","EI:136","Consider conflicting viewpoints","Emotional Intelligence"],["xostjq7","The human resources manager sends an email to all employees stating that they will need to park on the street on Tuesday because the maintenance department will be repairing the company's parking lot. This is an example of a(n)",["formal inquiry.","projection report.","informational message.","business proposal."],2,"Informational message. Communicating information involves providing others with facts. In the example, the human resources manager is informing the company's employees about an issue with the company's parking lot. The human resources manager is not writing a projection report, business proposal, or formal inquiry.","CO:039","Write informational messages","Communication Skills"],["x1j64k1k","When using an online search engine to obtain business information, employees should enter __________ in the search engine's __________ field.",["keywords; query","ordinary slang; subject","vague terms; reply","general phrases; answer"],0,"Keywords, query. A search engine is a software program that automatically crawls the web looking for information pertaining to specified search terms and then displays a list of results. To conduct an online search, the employee enters specific or keywords (terms, phrases, slang) that pertain to the topic of interest into the query field and clicks on the search button. The search will provide results that include the keywords in the description. The words entered into the query field should be specific enough to generate desired results. For example, entering the term, \"Washington,\" will likely generate responses about the U.S. state, the U.S. capitol, and the first U.S. president. If the researcher wanted information about manufacturers in Washington state, entering the words \"Washington state manufacturers\" into the query field would more likely provide the desired results; therefore, the more specific the keywords, the more applicable the results. The field in which a person enters keywords is not called a reply, answer, or subject field. Slang may or may not be a keyword.","NF:006","Demonstrate basic web-search skills","Information Management"],["x12xsrj4","What requirement of a legally enforceable contract requires that both of the parties who are entering into the contract are sane, sober, and of legal age?",["Capacity","Genuineness of assent","Consideration","Legality of purpose"],0,"Capacity. Certain conditions must be met for a contract to be legally enforceable. Capacity involves having the mental and cognitive ability to make and understand the agreement and the consequences of their actions. If one party is a child or is found to be mentally challenged or impaired, the contract is invalid and unenforceable. Consideration means that the agreement must include something of value that both parties bargain for. Genuineness of assent means that all parties know what they are agreeing to. Legality of purpose means that the agreement must not violate any laws.","BL:002","Describe the nature of legally binding contracts","Business Law"],["x2p2u6n","A business that produces products for which there is a steady, predictable demand for large quantities is most likely to use which of the following production processes:",["Batch","Unit","Intermittent","Continuous"],3,"Continuous. A continuous production process is one that turns out products without stopping. The process is used by businesses that make such products as soft drinks that are in steady demand by consumers and can be held in stock as necessary. An intermittent production system is shut down from time to time for various reasons, such as a decline in demand or an oversupply of stock. A batch production process produces specific quantities of a product as needed (e.g., restaurant entrees). A unit production process focuses on producing one or a few products at a time.","OP:017","Explain the concept of production","Operations"],["x1rfclgu","Annie recently started a new business. When selecting employees, she chose the applicants she knew personally rather than the individuals she had never met before. This is an example of",["objectivity.","nepotism.","puffery.","fairness."],1,"Nepotism. Nepotism is the practice of using one's power or influence to benefit one's friends or relatives. Choosing your friends and family members for a job, like Annie did, is an example of nepotism in action. This is not an example of fairness or objectivity; rather, it is an example of unfairness and subjectivity. Puffery involves making an unsubstantiated claim for personal gain, such as overstating a business's year-one profits to attract potential investors. Puffery is not demonstrated in this example.","EN:044","Describe the use of business ethics in entrepreneurship","Entrepreneurship"],["x2dgjfz","A restaurant has guidelines outlining how frequently employees should wash their hands and how often they should wipe down tables. These guidelines are examples of",["policies.","protocols.","precedents.","procedures."],0,"Policies. A policy is any guideline explaining how employees are to act. For example, a restaurant may have a strict policy regarding employee hygiene. The policy might outline how frequently employees should wash their hands and how often they should wipe down tables. A procedure, on the other hand, is a step-by-step process that employees must follow while performing a specific task. \"Protocol\" is often used to describe an organization's overall set of guidelines rather than a specific rule. A precedent is an earlier event used as an example for subsequent action.","PD:250","Adhere to company protocols and policies","Professional Development"],["x1f7xj1r","Before leaving for the night, employees of Double Scoop Ice Cream Shop are required to clean the counters, sweep the floor, and move leftover ice cream to overnight freezers. This closing process is an example of a(n)",["procedure.","policy.","agreement.","contract."],0,"Procedure. A procedure is a step-by-step process that personnel must follow in performing a specific task. Procedures and policies are similar but not the same. Procedures outline step-by-step processes, while policies are more general. A policy is any guideline that explains how employees are to act. The closing process of Double Scoop Ice Cream Shop is an example of a procedure, not a policy, contract, or agreement.","CO:057","Analyze company resources to ascertain policies and procedures","Communication Skills"],["xnranrr","Which of the following statements is true of diversity:",["Diversity applies only to minorities.","In group settings, diversity increases creativity and innovation.","Diversity in the workplace is decreasing.","Valuing diversity means ignoring or minimizing differences."],1,"In group settings, diversity increases creativity and innovation. Diversity brings different views, experiences, and strengths to the table. This is invaluable in a group setting. Think of it this way: If you fill a brainstorming session with people who are exactly like you, you won't get any new ideas. However, if you find people who have different backgrounds and experiences, they will likely have solutions you might not have thought of. Diversity doesn't just apply to minorities, and it doesn't refer only to race or ethnicity. Diversity includes everyone, which is why it's so important to learn to value diversity. Although some people think that valuing diversity means ignoring or minimizing differences, that's not the case. Instead, we should openly acknowledge differences and see them as assets, not problems. Diversity in the workplace is actually greatly increasing. A few decades ago, the workforce consisted predominantly of white men. Today, white men make up a much smaller portion of the workforce in the United States than before. That's why employees who value diversity are in high demand, and companies without them will find it difficult to succeed.","EI:033","Exhibit cultural sensitivity","Emotional Intelligence"],["xev0zs7","A primary reason that governments regulate the ways in which businesses must report financial data is to",["reduce taxes.","stimulate market growth.","ensure transparency.","eliminate mistakes."],2,"Ensure transparency. Governments require businesses to provide certain types of financial information to regulatory agencies and shareholders. The accounting function collects and records the financial information in the appropriate format. Transparency involves fully disclosing the required information so it is understandable to the intended audience. Governments do not regulate the ways in which businesses report financial data to reduce taxes or stimulate market growth. The consequences of incorrect information (e.g., fines) may reduce the risk of mistakes on the report, but the risk of mistakes cannot be eliminated.","FI:353","Explain legal considerations for accounting","Financial Analysis"],["x126laar","Iliana is running a charity raffle for her church, and she determines that she needs a roll of 200 tickets. What should she do next?",["See if the church already has tickets available.","Buy the roll of tickets online.","Come up with an alternative to using tickets.","Estimate the costs of the raffle."],0,"See if the church already has tickets available. After determining the specifications of the tangible resources she needs, Iliana should then determine what resources she already has. She should not buy the tickets online or come up with an alternative to using tickets before checking to see if the church already has the tickets available. Finally, estimating the costs of the raffle is not the next step to take after determining the specifications of needed tangible resources.","OP:003","Identify resources needed for project","Operations"],["x1r658of","Which of the following activities consumes most of a retail buyer's time:",["Promotion","Merchandise pricing","Merchandise selection","Sales force management"],2,"Merchandise selection. Selection of merchandise includes identifying merchandise with the greatest potential for resale, deciding what items to buy, calculating the appropriate quantities, choosing vendors, and determining when to buy. Managing the sales force, pricing goods, and planning promotions may also be part of the buyer's responsibility, but selecting merchandise is the buyer's primary task.","OP:015","Explain the nature and scope of purchasing","Operations"],["xzawr09","Which approach to fairness includes treating others how they deserve to be treated according to an ethical understanding of what is right?",["Empathy","Equality","Consistency","Justice"],3,"Justice. In the context of fairness, justice means treating others how they deserve to be treated according to an ethical understanding of what is right. When you act with justice in mind, you are taking people's unique needs into account when determining what is fair for that individual. The equality approach to fairness means treating people consistently regardless of their individual characteristics, traits, and circumstances. Empathy is understanding and identifying with the thoughts, feelings, values, attitudes, and/or actions of another person. Consistency is the state of being unchanging.","EI:127","Demonstrate fairness","Emotional Intelligence"],["x9ii7kl","When developing a presentation, it is important that each slide contain",["colorful graphics.","numerical data.","creative transitions.","key points."],3,"Key points. Employees use presentation software to develop visual aids that support an oral presentation. Slides for the presentation should include key points that highlight or reinforce the most important information, which may or may not include numerical data. Colorful graphics and creative transitions often make a presentation more interesting, but they are not necessary elements for each slide.","NF:008","Demonstrate basic presentation applications","Information Management"],["xz9mw6x","Luke is writing a complex report that will be submitted to the company's board of directors. He has collected relevant information that he would like to provide to the audience—information that is not necessary to include in the body of the report. In what section of the report should Luke include this supplemental information?",["Appendix","Table of contents","Executive summary","Bibliography"],0,"Appendix. Supplemental information for long or complex reports is presented in an appendix, which is a separate section placed at the end of a report. The information in the appendix might contain graphs, text, or a combination of both elements. A bibliography is a component of a report that summarizes the information sources that the writer used to prepare the report. An executive summary is an overview of the entire report. The table of contents is the portion of a long report in which the sections are listed with their page numbers.","CO:088","Select and utilize appropriate formats for professional writing","Communication Skills"],["x2u0tqn","Which of the following statements best describes the difference between an occupation and a career:",["Your occupation is your lifelong work journey, whereas your career is a short-term job.","Occupation is a broad term that describes the field you work in, whereas your career is your lifelong work journey.","Occupations generally bring you a sense of satisfaction or accomplishment, whereas careers are generally just for a paycheck.","An occupation is a short-term work endeavor, whereas a career is a long-term work endeavor."],1,"Occupation is a broad term that describes the field you work in, whereas your career is your lifelong work journey. An occupation is a category of work, such as “educator.” Within an occupation, there may be several different types of jobs, such as teacher, principal, guidance counselor, or reading specialist. Someone with an occupation of “educator” may have a career that includes several of those job titles. Careers often span an entire lifetime and are comprised of an individual's various jobs over time. Occupations and careers are generally long- term, whereas individual jobs may be short-term. Your occupation and your career may both bring you great satisfaction and accomplishment.","PD:034","Explain possible advancement patterns for jobs","Professional Development"],["x18flfru","Fellow employees come back from lunch late consistently, forcing you to cover their responsibilities. Which of the following is an example of using assertiveness to handle this problem:",["Reporting the problem to a supervisor","Applying for a different job","Ignoring the problem","Confronting the coworkers about the problem"],3,"Confronting the coworkers about the problem. Assertiveness is the ability to express yourself; communicate your point of view; and stand up for your rights, principles, and beliefs. Confronting the coworkers about the extra work you are doing for them and the fact that they are taking advantage of you and the company is healthy, assertive behavior. Reporting the problem, ignoring the issue, or changing jobs avoids a confrontation but does not solve the problem.","EI:018","Identify desirable personality traits important to business","Emotional Intelligence"],["xmpmhu4","One reason why creditors review a business's income statement is to decide if the business will be able to",["develop new products.","repay a loan.","increase staff.","expand operations."],1,"Repay a loan. Creditors are responsible for deciding whether a business should be given a loan. The income statement helps creditors assess the business’s creditworthiness and the risk of extending credit to the business. It provides the evidence needed to prove that the business can pay back the loan. Expanding operations, developing new products, and increasing staff are some of the reasons why a business might apply for a loan and need to provide creditors with its income statement.","FI:094","Describe the nature of income statements","Financial Analysis"],["x1aa2z18","Companies that implement a clear chain of command often experience a __________ workflow with less",["smoother; communication.","more flexible; redundancy.","smoother; redundancy.","more flexible; communication."],2,"Smoother; redundancy. Organizations with effective chains of command see a smoother workflow and tend to have fewer workflow problems such as redundancy and confusion. A strong chain of command can improve overall communication among employees, not lessen it—the chain of command ensures that communication within a company is methodical, orderly, and efficient. A chain of command does not make workflow more flexible because it implements a hierarchy that should be followed.","PD:252","Follow chain of command","Professional Development"],["x8i2air","One way that businesses can reduce the risk of credit card fraud at the point of sale is by",["establishing credit limits for card usage.","verifying the cardholder's identification.","reviewing sales receipts during closing procedures.","conducting a financial audit."],1,"Verifying the cardholder's identification. During a sales transaction, employees should ask customers to present another form of identification when they pay for items with a credit or debit card. By comparing the signature on the credit card that the customer presents with the signature or photo of another form of identification (e.g., driver's license), employees can verify that the customer is the authorized cardholder. Credit card issuers establish the credit limits for credit card holders. Reviewing sales receipts during closing procedures, conducting a financial audit, and establishing credit limits for card usage are not ways to reduce risks associated with credit card fraud at the point of sale.","OP:013","Explain routine security precautions","Operations"],["x12iyhcp","The migration of people from one location to another that affects the types of products that businesses sell is an example of a",["population trend.","social lifestyle.","geography issue.","transportation route."],0,"Population trend. Migration is a population trend that indicates the movement of people throughout the country as well as into and out of the country. Migration trends are important to businesses because businesses need to know where their customers are located. For example, many people are leaving colder climates and migrating to what is considered the Sunbelt. This movement affects businesses because the types of products they sell and the way they sell them will change. Also, the increased migration of ethnic groups into the country creates a need for new goods and services that meet the needs of a multicultural population. The migration of people from one location to another is not a geography issue, a transportation route, or a social lifestyle.","NF:013","Describe current business trends","Information Management"],["x1wdihbc","A business's ethics determine whether an action is acceptable for that business, especially if the action",["contributes to the business's profitability.","has a negative impact on others.","is illegal.","affects the environment."],1,"Has a negative impact on others. A business's ethics determine whether an action is acceptable for that business, especially if the action has a negative impact on others—employees, customers, community members, etc. Sometimes, a business's ethics influence its decision on an environmental issue, but the environment is not a more important factor in ethics than any other issue. Anything illegal should be unacceptable for a business, regardless of its ethics. Sometimes, unethical practices may contribute to a business's profitability, but this is not necessarily a more important factor than others in determining a business's actions.","EC:106","Explain the nature of business ethics","Economics"],["xruilc5","What is the most important piece of information that a cash flow statement provides?",["Amount of money expected","Beginning of tax year","Cost of maintenance","Statistics from industry"],0,"Amount of money expected. How much money will flow into and out of a business is typically the most important piece of information that a cash flow statement provides. Businesses need to know whether they will have enough cash coming in to meet monthly obligations. For example, if businesses discover that they will not collect enough money, they can plan a sale to generate more income or tighten their credit policies. Predicting the cost of maintenance is only a small part of estimating expenses in a cash flow statement. Businesses decide when their tax year will begin. Many businesses use industry statistics when developing their cash flow statements.","FI:091","Describe the nature of cash flow statements","Financial Analysis"],["x1tre4ju","As a team leader, taking responsibility for your team's success or failure in achieving the vision is part of",["being an example.","being a good listener.","establishing good working relationships.","being enthusiastic."],0,"Being an example. Taking responsibility for your team's success or failure as it works toward the vision is being an example and a sure sign of solid leadership. This responsibility does not necessarily relate to establishing good working relationships, being enthusiastic, or being a good listener.","EI:060","Enlist others in working toward a shared vision","Emotional Intelligence"],["xhz3hgh","Making required textbooks available at a campus bookstore is an example of creating __________ utility.",["time","form","place","possession"],2,"Place. Place utility is usefulness created by making sure that products are available at the place where they are wanted or needed by consumers. Textbooks are needed on campus and will be sold there to students and faculty. Time utility is usefulness created when products are made available at the time they are needed or wanted by consumers. Form utility is usefulness created by altering or changing the form or shape of a good to make it more useful to the consumer. Possession utility is usefulness created when ownership of a product is transferred from the seller to the user.","EC:004","Determine economic utilities created by business activities","Economics"],["xodjv8u","A country can often produce goods more cheaply than other nations because it",["places limits on its imports.","has easy access to raw materials.","possesses a very high standard of living.","is not subject to tariffs and quotas."],1,"Has easy access to raw materials. Because countries have different resources, they trade with one another to get what they want and need. Countries can often produce goods more cheaply than other countries because they have easy access to raw materials, up-to-date technology, or workers with special skills. Countries are more efficient when they produce products for which their resources are best suited. Placing limits on imports, lack of tariffs and quotas, and a very high standard of living do not necessarily affect a nation's ability to produce goods cheaply.","EC:016","Explain the nature of global trade","Economics"],["x1i652gu","Which of the following factors have provided businesses with more opportunities to buy and sell products at the international level:",["Language barriers","Strict safety standards","Free trade agreements","Protectionism"],2,"Free trade agreements. Free trade agreements lessen the trade restrictions (e.g., tariffs, quotas, licenses) among countries. For example, the United States-Mexico-Canada Agreement (USMCA) is a trade agreement among the United States, Canada, and Mexico that has eliminated trade barriers. When fewer trade barriers exist, there are more opportunities for businesses to buy and sell products in other countries. Protectionism is a government's policy to protect domestic industries and businesses against foreign competition. Protectionism, language barriers, and strict safety standards often hinder a business's ability to enter international markets.","EC:104","Discuss the global environment in which businesses operate","Economics"],["x130us7r","Monitoring your progress is an important step in improving self-control because it allows you to",["adjust your efforts if necessary.","set new goals.","identify a target behavior.","change your environment."],0,"Adjust your efforts if necessary. Only by monitoring your progress can you determine whether the methods you are using are working or need to be changed. Changing your environment is not always possible. Identifying the target behavior involves selecting the behavior you wish to change. New goals should be set at the beginning of the process.","EI:025","Demonstrate self-control","Emotional Intelligence"],["x1vfhkyt","Which of the following levels of managers spend most of their time staffing, directing, and controlling the day-to- day activities of the business:",["Mid-level","Executive","First-line","Regional"],2,"First-line. First-line or supervisory managers work directly with the employees who carry out the business's routine work. First-line managers report to the mid-level managers. Mid-level managers are responsible for implementing the goals set by executive (top-level) managers, and are the link between supervisory and executive (top-level) managers. Mid-level managers report to the executive managers. Executive managers are responsible for the whole organization and spend most of their time setting organizational goals and conducting strategic planning. A regional manager manages employees in a specific location or region. Regional managers are usually considered mid-level managers.","SM:001","Explain the concept of management","Strategic Management"],["xf7xq4r","When Emily posts an advertisement for a job opening on an employment website, she is using technology for __________ purposes.",["performance-management","training","selection","recruitment"],3,"Recruitment. Recruitment involves seeking out and attracting potential employees. Primary technological tools that human-resources professionals use to recruit job candidates include their company websites and employment websites such as Monster and Indeed. The employee-selection process involves identifying the most qualified candidates for a job through screening and interviewing processes. Performance management facilitates the activities and processes used to evaluate employees' job performance. Training uses different methods to teach employees how to perform their jobs. Emily is not using technology for employee-selection, performance-management, or training activities.","HR:412","Describe the use of technology in human resources management","Human Resources"],["x1mlpc94","A business that fails to protect its employees from unnecessary risk or health hazards on the job may be sued for",["negligence.","incompetence.","libel.","misrepresentation."],0,"Negligence. A business might be sued for negligence if it does not take reasonable precautions to protect workers from risks or health hazards on the job. The basis of negligence is that the problems could have been easily avoided if the business had made some minor adjustments. Consequently, businesses usually try to make the workplace as safe as possible in order to avoid being sued for negligence. Misrepresentation involves making unrealistic claims about products. Libel is making false statements that harm an individual's reputation. Incompetence involves not having the skills or abilities necessary to perform satisfactorily.","BL:001","Describe legal issues affecting businesses","Business Law"],["xw1vu9y","What is one of the reasons that economic systems are necessary?",["Products are expensive.","Governments are unstable.","People are interdependent.","Resources are unlimited."],2,"People are interdependent. People in all economic systems are interdependent. In other words, they must depend on each other to obtain the things they need. The economic system provides a way for this to happen. For example, people work to produce goods and services for others but also earn incomes that they use to buy goods and services that they cannot make for themselves. Many resources are limited rather than unlimited. Some governments are unstable, but many are stable. The cost of products ranges from inexpensive to expensive. These factors are not the reasons that economic systems are needed.","EC:007","Explain the types of economic systems","Economics"],["x1hwde7","Ashley owns a small hardware shop. Every month, she reviews her inventory lists to see which products are popular and which are not. Using this information, Ashley is able to order the appropriate amount of each product for her store. This is an example of the importance of",["stocking a diverse array of products.","monitoring internal records.","over-purchasing certain products.","ignoring inventory when ordering."],1,"Monitoring internal records. Monitoring internal records for business information is an important practice for business owners. By tracking records such as inventory, business owners can gain valuable business information such as which products are doing well and which products are less popular. This example demonstrated the importance of monitoring internal records, not over-purchasing certain products, stocking a diverse array of products, or ignoring inventory when ordering.","NF:014","Monitor internal records for business information","Information Management"],["x1bvqvm5","Which of the following is a disadvantage of consensus building:",["Discussing different points of view","Encouraging unnecessary compromise","Relying on group members' persuasive skills","Making each person speak in front of the group"],1,"Encouraging unnecessary compromise. A disadvantage of consensus building is that it encourages group members to compromise even when it might not be wise for a group member to compromise on their personal beliefs. Persuasive skills should not be a part of consensus building. But, if they are, consensus building certainly does not rely on them. Some group members may speak in front of the group, but no one is required to. Everyone is given equal say, but how a group member presents their information can vary. Discussing different points of view is not a drawback to consensus building. In fact, it promotes consensus.","EI:011","Use consensus-building skills","Emotional Intelligence"],["x1y91j0w","Marley is working with a group member who's explaining her part of a project. Marley wants to make sure her group member knows she's listening, so she says things like, “I see,” “uh-huh,” and “I understand.” Which active listening skill is Marley demonstrating?",["Using a verbal acknowledgment response","Repeating critical information","Collecting all the information possible","Paraphrasing the message to test her understanding"],0,"Using a verbal acknowledgment response. In one-on-one or small group conversations like Marley's, a short verbal response lets the speaker know you are paying close attention. By saying things like “I see” or “uh-huh,” you let the other person know that you're actively listening. Repeating critical information is another important active listening skill that involves repeating things like phone numbers, names, or websites. When you paraphrase the message, you repeat what the other person said but in your own words. When you collect all the information possible, you observe gestures, interpret body language, and listen to the person's tone of voice. All of these are important active listening skills, but they aren't what Marley is doing in this example.","CO:017","Demonstrate active listening skills","Communication Skills"],["x1lx305n","Tallulah's coworkers describe her as adaptable, cooperative, enthusiastic, and optimistic. When she comes across a problem at work, Tallulah figures out how to solve it without being asked. In other words, Tallulah shows",["initiative.","respect.","aggressiveness.","empathy."],0,"Initiative. Initiative is the willingness to act without having to be told to do so. People who demonstrate initiative are willing to accept and seek out additional or even unpleasant duties. By figuring out how to solve a problem at work without being asked, Tallulah is demonstrating initiative, not necessarily aggressiveness, empathy, or respect.","EI:024","Explain the importance of demonstrating initiative","Emotional Intelligence"],["x1n7crhd","It is difficult to make decisions that can cause you harm, which is why financial professionals often act unethically due to",["loss aversion.","sunk costs.","conformity.","self-interest."],3,"Self-interest. It is natural to look out for yourself! Self-interest, however, can bias decision-making. It is difficult to make the ethical choice if it goes against your own well-being, which is why finance professionals sometimes act unethically to protect themselves. Loss aversion is the tendency to avoid a loss at all costs, even when attempting to avoid that loss can lead to negative consequences. Conformity is the tendency to behave in the same way that everyone else does rather than exercising one's own judgment. Sunk costs are costs that have already been incurred and thus cannot be recovered.","FI:355","Discuss the role of ethics in finance","Financial Analysis"],["xju31hx","Sales commissions are a __________ expense.",["fixed","variable","one-time","capital"],1,"Variable. Sales commissions are a variable expense—they usually fluctuate with changes in production. They are not a one-time expense—businesses pay them on a continual basis. They are not a capital expense—these are one-time purchases a business makes, such as land or equipment. They are not a fixed expense—fixed expenses do not change along with changes in production.","OP:024","Explain the nature of overhead/operating costs","Operations"],["x1y2t0k3","What should you do if a customer is being difficult or demanding?",["Tell the customer that their attitude is inappropriate.","Promise to give the customer a significant discount.","Continue to treat them with courtesy and respect.","Ignore them and focus on another customer."],2,"Continue to treat them with courtesy and respect. Even if a customer is difficult and demanding, they should still be treated well. You should never ignore a customer, and it's out of line to tell a customer that their attitude is inappropriate. You also shouldn't confront customers. Even if they're being rude, you still must treat them respectfully. Be careful about making promises to the customer that you might not be able to fulfill. Broken promises are poor customer relations, so avoid promising anything unless you're sure that your manager would approve.","CR:003","Explain the nature of positive customer relations","Customer Relations"],["x13u85v7","Emma is reviewing the sales budget in relation to the actual sales generated for a set time frame. How is Emma using financial information in this situation?",["To analyze the impact of aging accounts","To compare estimated performance with actual performance","To establish new quality standards and benchmarks","To identify external economic trends"],1,"To compare estimated performance with actual performance. Businesses rely on accurate financial information to make sound business decisions. In the situation provided, Emma is comparing one financial report (budget) with another financial report (actual sales) to determine if the business performed as expected—if it achieved its sales goals. Although external economic conditions can affect sales, Emma is analyzing internal financial information rather than identifying external economic trends. Emma is not establishing new quality standards and benchmarks or analyzing the impact of aging accounts.","FI:579","Describe the need for financial information","Financial Analysis"],["xkhlal5","Marketing is described as creating",["gaps.","exchanges.","advertisements.","needs."],1,"Exchanges. Marketing is described as creating exchanges—or encouraging trade by providing opportunities. Regarding the other options, marketing satisfies needs, uses advertisements, and bridges the gap between producers and customers.","MK:001","Explain marketing and its importance in a global economy","Marketing"],["x1fdkgyq","As an employee, you should accept your supervisor's suggestions for improvement and then",["forget the suggestions.","change your behavior.","go your own way.","complain to your coworkers."],1,"Change your behavior. Constructive criticism is evaluative information designed to help someone improve. Changing your behavior is both the intent of the feedback and the desired outcome. Forgetting about the suggestions and going your own way or complaining about them will not benefit you and may cause you problems.","EI:003","Explain the use of feedback for personal growth","Emotional Intelligence"],["x19qzvsh","The employees of the DER corporation have personally helped establish quality control guidelines to follow when serving customers. When problems occur, they discuss ways to further improve customer service with their supervisors. What type of quality control strategy is the DER corporation using?",["Feedback control","External control","Concurrent control","Internal control"],3,"Internal control. Quality guidelines established by employees to solve problems are a type of internal control strategy. External control refers to rewards tied to performance and the supervision of employees by managers. Concurrent control monitors activities during their performance and makes corrective suggestions. Feedback control evaluates an activity afterwards and points out what may have gone wrong.","OP:164","Utilize quality control methods at work","Operations"],["xwxw1ey","Which of the following is an advantage of opening a franchise:",["Paying royalties","Reliance on raw materials","Restrictions on products, prices, and location","A well-known brand name"],3,"A well-known brand name. Often, opening a franchise brings an existing customer base that is familiar with the brand name, which can increase the possibility of success in comparison to a new, unknown business. Paying royalties and restrictions on products, prices, and location would be considered disadvantages of opening a franchise. Reliance on raw materials is a disadvantage of the manufacturing business model.","EC:138","Describe types of business models","Economics"],["x1c2km93","What type of planned obsolescence is generally considered socially and economically desirable because the replacement product offers more benefits or a lower cost?",["Technological","Style","Psychological","Fashion"],0,"Technological. Technological obsolescence equates to significant technological improvements that result in a more effective product (e.g., CDs, from cassettes, from phonograph records). Style obsolescence refers to superficial changes to a product resulting in a new product. The new model is intended to make users of the older model feel out-of-date and encourage them to purchase the new model. This is typical in fashion merchandise. Psychological and fashion are synonymous with style obsolescence.","PM:040","Explain business ethics in product/service management","Product/Service Management"],["x9l0h8x","Which of the following is an element of an effective survey:",["An explanation of its purpose","A long set of instructions","Biased questions","Vague questions"],0,"An explanation of its purpose. It's important to let survey participants know why a survey is being administered. This means explaining what information is being collected and how it will be used. Questions should be unbiased and as clear as possible. Instructions should be as short and concise as possible.","IM:418","Explain characteristics of effective data-collection instruments","Marketing-Info Management"],["xv7rp8i","A company's strategy, culture, and communication combine to form brand",["identity.","touchpoints.","promise.","cues."],0,"Identity. Brand identity is the culmination of what a company wants to be—what it says about who it is. Strategy, culture, and communication all contribute to brand identity. Brand touchpoints are any instances in which the customers encounter the brand, such as a promotional message or a company website. Brand cues are messages that affect buying behavior in regard to a brand, such as a certain word that makes a customer think of a product. A brand promise is a commitment made by a brand to its customers about what it intends to deliver.","PM:207","Describe factors used by businesses to position corporate brands","Product/Service Management"],["x1dnv2q2","Naomi uses quality market research methods, is open about those methods, and backs up the research with transparent, objective analysis. Naomi is establishing",["privacy.","credibility.","competition.","adaptability."],1,"Credibility. Credibility is believability. It is critical that marketers ensure the information they manage is believable. Otherwise, no one will trust the information, and it won’t be useful. Marketers can establish credibility by using quality research methods, being open about those methods, and backing up the research with transparent, objective analysis. Naomi is not establishing competition, privacy, or adaptability in this scenario.","IM:025","Explain the role of ethics in marketing-information management","Marketing-Info Management"],["xtkth8c","Which of the following is the most common distribution channel for consumer goods:",["Producer to ultimate consumer to agent to retailer","Producer to wholesaler to retailer to ultimate consumer","Wholesaler to producer to retailer to ultimate consumer","Retailer to agent to ultimate consumer to producer"],1,"Producer to wholesaler to retailer to ultimate consumer. Producer to wholesaler to retailer to ultimate consumer is the most common distribution channel for consumer goods. First, the producer makes the good. Next, the wholesaler moves the good from the producer to the retailer. Then, the retailer sells the good, and finally, the ultimate consumer purchases it. An agent is a business or individual that assists in the sale and/or promotion of goods and services but does not buy them from the producer. If an agent is used, their involvement is typically the second step of the process after producer.","CM:003","Explain the nature of channels of distribution","Channel Management"],["x18oo1q9","A business's expense reports and cash-register receipts are sources of __________ research data.",["internal, quantitative","external, quantitative","elementary, qualitative","organic, qualitative"],0,"Internal, quantitative. Internal data, such as expense reports and cash-register receipts, are generated within the business. Because expense reports and cash-register receipts contain specific, numerical, measurable data, they are quantitative data. Businesses collect external data from outside sources such as competitors' web sites and government publications. Qualitative data are based on emotions, feeling, thoughts, and experiences. Elementary and organic are not types of data.","IM:281","Describe options businesses use to obtain marketing research data (i.e., primary and secondary research)","Marketing-Info Management"],["x12g3g93","During the first year that Rick owned his new car, the vehicle seemed to spend more time in the repair shop than it did on the road. Rick contacted the auto manufacturer and demanded his money back because the car seemed to be defective, but the manufacturer refused. A member of the Better Business Bureau agreed to act as an impartial third party in the dispute. The BBB member studied the facts of the case, determined that the car was indeed defective, and decided how much money the carmaker would be required to refund to Rick. This is an example of",["automation.","attrition.","arbitration.","arbitron."],2,"Arbitration. When two parties engage in a dispute that they are unlikely to resolve on their own, an impartial third party may step in. The impartial third party, called an arbitrator, hears both sides' arguments, studies the facts of the case, and then determines a remedy for the situation. This process is called arbitration. The Arbitron Ratings Company uses consumer-generated data to analyze radio advertising. Attrition is a natural reduction in numbers of people due to death, retirement, job changes, etc. Automation is a production method in which machines do tasks automatically.","PM:017","Identify consumer protection provisions of appropriate agencies","Product/Service Management"],["xuca7wt","What are businesses often able to do if they have a narrow product mix?",["To industrialize","To generalize","To specialize","To cannibalize"],2,"To specialize. Businesses having a narrow product mix often are able to specialize, which allows them to produce efficiently and concentrate on marketing their limited number of product lines. Businesses with only a few product lines are able to focus all their efforts on their limited specialties. Cannibalization is the situation that exists when the sale of one of a company's products takes away sales from another of its products. Generalization is the opposite of specialization. Industrialization is the changeover from producing goods by hand labor to the use of machines and the organization of such production into industries.","PM:003","Explain the concept of product mix","Product/Service Management"],["x1grb2e8","Which of the following is the type of branding that differentiates an organization from its competitors:",["Corporate","Product","Universal","Loyalty"],0,"Corporate. A corporate brand is all of the combined impressions, images, or experiences associated with a company or parent entity. Disney is an example of a corporate brand. The Disney theme parks and resorts, Marvel Entertainment, ABC and ESPN television networks, and consumer products are areas within the Disney corporate brand. Product brands are the combined impressions, images, and experiences associated with a particular good, service, or product line. Loyalty and universal are not types of brands.","PM:206","Explain the nature of corporate branding","Product/Service Management"],["x1hxu68m","During the decline stage, a company may choose to discontinue a product and sell off the remaining inventory in a process known as",["a super sale.","penetration pricing.","foreclosure.","liquidation."],3,"Liquidation. During the decline stage, a company may choose to discontinue a product and sell off the remaining inventory in a process known as liquidation (converting assets to cash). Penetration pricing is a strategy used during the introduction stage, where marketers price a product low to achieve rapid market acceptance. A company may or may not sell inventory in a super sale—they often sell it to another company, not retail customers. A foreclosure occurs when a person or business can no longer make payments on a piece of property.","PM:024","Identify the impact of product life cycles on marketing decisions","Product/Service Management"],["x65lhyp","A disadvantage to businesses that use email as a direct-mail strategy is that recipients may not get the message because many computers have",["invalid home addresses.","spam filters.","promotion controls.","reply options."],1,"Spam filters. Direct mail is a promotional medium that comes to consumers' homes and businesses. Email is a form of direct mail that businesses send by computer. Spam is junk email that the recipient does not request and does not allow the recipient to request removal from the subscriber list. To reduce the amount of spam recipients receive, businesses and consumers are installing software programs that filter the spam, which keeps it from reaching the intended recipients. Invalid email addresses, rather than home addresses, would prevent email recipients from receiving email. Reply options do not keep email from reaching the intended message recipients. Promotion control is a fictitious term.","PR:089","Explain the nature of direct marketing channels","Promotion"],["x1l7028d","Which of the following is the main internal audience for public relations activities:",["Suppliers","Employees","Labor unions","Community leaders"],1,"Employees. Most businesses provide information to employees, the business's main internal audience. Providing information is a public relations activity because it is intended to maintain good relations with employees. Employees tend to work more effectively and have higher morale when they are well informed and have accurate information about the business's plans and goals. Providing accurate information also reduces rumors, which may have a negative impact on employees. Suppliers, labor unions, and community leaders are not internal audiences, although they have direct contact with many businesses.","PR:253","Discuss internal and external audiences for public-relations activities","Promotion"],["x1jvo6fb","Qualitative marketing data are valuable, but they can be limited because",["the data do not provide enough detail.","the data are objective rather than subjective.","the data usually only include a small portion of the target market.","participants' responses are constrained by limited options."],2,"The data usually only include a small portion of the target market. Qualitative data provide researchers with valuable knowledge to use in planning marketing activities. The scope, however, is limited. Since qualitative research usually only includes a very small portion of the target market, it is often not enough to make generalizations about an entire population. In qualitative data, participants' responses are not necessarily constrained by the limited options. Qualitative data tend to provide more detail than quantitative data. Finally, qualitative data are subjective rather than objective.","IM:289","Describe data-collection methods (e.g., observations, mail, diaries, phone, internet, discussion groups, interviews, scanners, tracking tools)","Marketing-Info Management"],["xb5y2qk","A pricing tactic used by some businesses that might be unethical is one that",["confuses customers.","advertises discounts.","offers rebates.","is competitive."],0,"Confuses customers. A business that deliberately tries to confuse customers about the price of goods and services may be behaving unethically. Some pricing structures may be complex, which makes them difficult for customers to understand. As a result, customers usually are unable to figure out how to get a lower price and end up spending more than they should. This practice is considered unethical because customers don't have a fair chance to get the best price. Most pricing tactics are intended to be competitive. It is also common for businesses to advertise discounts and offer rebates. These tactics are not unethical.","PI:015","Describe the role of business ethics in pricing","Pricing"],["x18a2rr5","Which of the following is an aspect of coordinating the distribution of a product with other marketing activities:",["Setting an appropriate price","Analyzing customer satisfaction","Developing an operating budget","Recruiting qualified personnel"],0,"Setting an appropriate price. Setting the price of a product is one of the marketing activities that a business should coordinate with distribution in order to successfully sell to customers. Not only does a business need to make its product available, but it also must sell it at a price that consumers are willing to pay. If a product is not priced appropriately, customers usually will not buy it even if it is widely distributed. Businesses often analyze customer satisfaction after a product is marketed to determine if any changes need to be made. Developing an operating budget and recruiting qualified personnel are not marketing activities.","CM:007","Coordinate channel management with other marketing activities","Channel Management"],["xv1vl1v","Providing favorable adjustment and return policies is one way that a __________ builds clientele.",["business","society","coalition","salesperson"],0,"Business. Without a loyal customer base, a business cannot thrive in the marketplace. A business that develops and implements favorable adjustment and return policies not only makes the customer happy, but helps the salesperson sell the product and improves the business's overall ability to build a loyal clientele. A society is a group of individuals that shares an environment. A coalition is a group of individuals who gather for a specific purpose. Societies and coalitions do not exist for the purpose of building clientele.","SE:828","Explain key factors in building a clientele","Selling"],["xbgrzpn","A company's managers ask themselves, “Why is our market share dropping?” This is an example of a __________-oriented decision problem.",["discovery","strategy","situation","research"],0,"Discovery. Discovery-oriented decision problems are aimed at answering the questions “what?” or “why?” Strategy-oriented questions are aimed at answering the questions “how?” or “which?” A research problem asks what research needs to be done to solve the decision problem. This is not referred to as a situation-oriented problem.","IM:282","Discuss the nature of marketing research problems/issues","Marketing-Info Management"],["x1udrwtv","Which of the following might a salesperson rely on to obtain firsthand product knowledge:",["Customer opinion","Vendor information","Personal experience","Government reports"],2,"Personal experience. An effective way of obtaining firsthand product knowledge is for a salesperson to use the product personally. Salespeople who use the products they sell find out exactly how the product works and often are better able to answer customers' questions. Personal experience is a good way of learning about products. Customer opinion, vendor information, and government reports are not ways of obtaining firsthand product knowledge.","SE:062","Acquire product information for use in selling","Selling"],["xfw91pk","What type of promotional media is a business using when it sends out a postcard telling customers who recently purchased products that the business is adding a new line of products?",["Direct mail","Participative","Sales letter","Persuasive"],0,"Direct mail. Direct mail is a promotional medium that comes to consumers' homes and businesses. Businesses that use direct mail often send it to current customers who are likely to buy more products. Persuasive direct mail encourages immediate action such as mail orders or inquiries. A sales letter is a type of printed direct mail, as is a postcard. Participative is not a type of direct mail.","PR:007","Explain types of advertising media","Promotion"],["xate42f","One of the customer benefits of warranties and guarantees is the right to",["free training.","legal recourse.","lower prices.","personalized service."],1,"Legal recourse. There are many different kinds of benefits from warranties and guarantees. Consumer benefits from warranties and guarantees include legal recourse if a company does not fulfill its obligations under a warranty or a guarantee. The courts will uphold a legitimate claim and see that the customer obtains satisfaction. The benefits of warranties and guarantees do not include lower prices, personalized service, and free training.","PM:020","Explain warranties and guarantees","Product/Service Management"],["x126z22d","One way that businesses use environmental monitoring in the marketing planning process is to",["obtain information about natural resources.","identify changes that might be opportunities.","locate health-conscious consumers.","review the safety status of physical facilities."],1,"Identify changes that might be opportunities. Environmental monitoring involves tracking external forces, such as population statistics, to determine if there are new trends that indicate changes. By identifying any changes in the external environment, businesses can decide if these changes might be opportunities for the business. For example, statistics might show that there has been a 50% decrease in milk consumption in the last 10 years. A business that produces and sells other types of beverages might decide that this change is an opportunity for the business to reach the market that no longer drinks milk. Businesses do not use environmental monitoring in the marketing planning process to obtain information about natural resources, locate health-conscious consumers, or review the safety status of physical facilities.","MP:008","Explain the role of situation analysis in the marketing planning process","Market Planning"],["x1stojcs","When marketers are developing the product element of the marketing mix, which of the following factors should they consider:",["When messages should be delivered","How to raise a product's value","Which brands should be used","How much of the product to order"],2,"Which brands should be used. The product element of the marketing mix focuses on the goods, services, or ideas a business will offer its customers. When developing the product element, marketers should consider which brands should be used, what level of quality should be produced or provided, and how the product should be packaged, among other things. How to raise a product's value is something that marketers would consider when developing the price element of the marketing mix. How much of the product to order is something marketers would consider in the place element. When messages should be delivered would be considered part of the promotion element.","MP:001","Explain the concept of marketing strategies","Market Planning"],["xdrhofx","Ryan works in marketing at a telecommunications company. His current assignment involves conducting research on customers' TV viewing preferences. He designs a survey to send to customers in the mail, holds a focus group to learn more about his customers' television activity, and recruits participants for a formal study using an in-home data tracking device. Ryan is displaying which of the following good research practices:",["Using multiple types of research methods","Defining and articulating a research question","Reevaluating the research question as needed","Engaging in research planning before starting"],0,"Using multiple types of research methods. Mixed methods research is a research methodology that involves collecting and analyzing data from various sources using various methods. This type of research usually involves both qualitative (descriptive) and quantitative (numerical) data. Researchers who utilize various methods to gather information gain a better understanding of the topic they are studying than if they had used a single research method. Defining and articulating a research question, engaging in research planning, and reevaluating the research question as needed are also examples of good research practices; however, they are not demonstrated in this scenario.","IM:428","Assess appropriateness of marketing research for the problem/issue (e.g., research methods, sources of information, timeliness of information, etc.)","Marketing-Info Management"],["xz15bks","Six Thinking Hats is a creative-thinking technique that stimulates idea generation by",["categorizing information.","assigning each group member a different job.","playing the devil's advocate.","providing positive feedback."],0,"Categorizing information. The Six Thinking Hats technique is a creative-thinking technique that utilizes different ways of approaching a problem. Each of the six hats represents one aspect of the situation. For example, the white hat looks at all the facts and data available. The blue hat summarizes and organizes thoughts and information. By placing each aspect into different categories, the situation can be evaluated by using various viewpoints. Playing the devil's advocate or looking at the negatives of the situation is one part of the overall technique. The Six Thinking Hats technique can be used in a group or alone. Therefore, it cannot be assumed that this method of creative thinking is always conducted in a group situation where each group member is assigned a different job. Positive feedback is a general term and is not necessarily a step in the Six Thinking Hats creative-thinking technique.","PM:127","Identify methods/techniques to generate a product idea","Product/Service Management"],["xp7gmws","Marketers can gain an understanding of how customers behave by studying",["physiology.","psychology.","geography.","demography."],1,"Psychology. Psychology is the science that deals with the characteristics of human behavior. Marketers can gain an understanding of how and why people behave the way they do by studying psychology. Understanding customers' buying behavior and what makes them tick helps marketers to better meet their needs. Demography is the study of the characteristics of populations. Physiology is the biological study of the functions of living organisms. Geography is the study of the earth.","PD:024","Explain employment opportunities in marketing","Professional Development"],["x16sljif","Reaching closure is the phase in the selling process when salespeople often need to",["identify customer reactions.","sell product benefits.","answer remaining objections.","determine buying needs."],2,"Answer remaining objections. Reaching closure is the fourth phase of the selling process. It often involves answering any remaining objections the customer may have. Salespeople should anticipate objections and learn to use them to their advantage in a sales presentation. When customers are satisfied that their objections have been satisfactorily addressed, they often give off signals that the time has come to close the sale. Salespeople sell product benefits when prescribing solutions to customer needs. Salespeople do not determine buying needs or identify customer reactions during the reaching closure phase of the selling process.","SE:048","Explain the selling process","Selling"],["xqffcy6","A large firm conducts a series of focus groups to determine if it should release a new product. What should the firm do with the data resulting from the focus groups?",["Use the data to make generalizations.","Analyze data with statistics.","Act immediately on the data.","Identify problems with the new product."],3,"Identify problems with the product. The data results from focus groups are qualitative data, which are difficult to analyze statistically. This is because focus groups use small sample sizes and are relatively unstructured, as opposed to a survey of a large portion of the population. The firm should not use the data to make generalizations about the entire population because the sample size is small. The firm should definitely not act immediately on the data because there is no way to analyze the results.","IM:062","Explain techniques for processing marketing data","Marketing-Info Management"],["x18jnhpw","Barney's Computers advertises that the company provides delivery and instruction to purchasers of computer packages. Barney's is offering __________ services.",["design","pure","product-screening","product-related"],3,"Product-related. There are two kinds of services that businesses offer: pure services and product-related services. Pure services do not include a tangible product, while product-related services are services that are offered with a product. Product screening is not a type of service but the process of considering each idea for a new product and discarding those that seem unworkable. Design is the way in which a product functions or the way it looks.","PM:001","Explain the nature and scope of the product/service management function","Product/Service Management"],["xrkyzdp","Which of the following is a benefit of using technology in channel management:",["It eliminates the need for employees.","It increases delivery times.","It increases efficiency.","It decreases the accuracy of orders."],2,"It increases efficiency. Technology can be used to increase the efficiency of channel management. Although it can save a company time and money, it does not mean that no employees are needed. It increases the accuracy of orders and decreases delivery times.","CM:004","Describe the use of technology in the channel management function","Channel Management"],["xs4lliw","With a high level of selling ethics, you would typically ask which of the following questions in an ethical situation:",["What is the right thing to do?","What is required of me?","What can I get away with?","What would others advise?"],0,"What is the right thing to do? With a high level of selling ethics, you would typically ask, \"What is the right thing to do?\" You would not consider what you could get away with, and you would not do only what is required. Although you might consider someone else's advice, the right thing to do may be different from that advice.","SE:106","Explain legal and ethical considerations in selling","Selling"],["x1u4gpw0","When a channel member has the means to provide certain financial incentives to cooperative intermediaries in the supply chain, the channel member is exerting its power through",["a reward system.","sanctions and tariffs.","tying agreements.","its expertise."],0,"A reward system. All of the businesses and individuals that move goods and services through a product's supply chain are the distribution channel members. The channel members depend on each other to make sure the end users receive the products when they need them and where they need them. Depending on the product and the nature of the channel relationship, one channel member may have a power source that the other channel members do not have. For example, a channel member that can offer financial incentives to one or more channel members to move products has power based on the ability to provide rewards. If a channel member has knowledge that other channel members don't have, that channel member's power base is expertise. Sanctions are the ability to penalize a channel member. A tying agreement is an illegal agreement requiring a customer to buy other products in order to obtain desired goods and services.","CM:008","Explain the nature of channel-member relationships","Channel Management"],["xffuso7","Leena reviews Remy's advertisement draft and notes that it looks too cluttered and busy. “Customers would feel overwhelmed looking at this!” she explains. How should Remy revise his advertisement?",["Decrease the margins.","Decrease the font size.","Add white space.","Add more images."],2,"Add white space. Adding white space will help improve readability, create balance, and focus readers' attention. Decreasing the font size, adding more images, and decreasing the margins would make the advertisement more difficult to read and less effective. An advertisement should make the best
